[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banister"
version = "0.1.0"
description = "Banister — Self-hosted AI training coach Telegram bot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "aiogram>=3.13.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "anthropic>=1.0.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dateutil>=2.9.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.0",
    "aiosqlite>=0.20.0",
    "filelock>=3.16.0",
    # Python's zoneinfo has no bundled IANA database — it reads the host OS's, which
    # Windows never has and a slim Docker base image (the deployment target, spec 001)
    # may not either. Found live: ZoneInfo("Europe/Paris") in app/llm/tools.py raised
    # ZoneInfoNotFoundError on a real machine, breaking every conversational chat
    # message. tzdata vendors the database so this can't depend on the host.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]
# Tracing LLM optionnel (Phoenix, self-hosted — voir CLAUDE.md § Observabilité).
# Extra plutôt que dépendance de base : PHOENIX_ENABLED=false par défaut (app/config.py),
# donc la majorité des déploiements n'en ont jamais besoin — pas de raison de leur imposer
# grpcio/protobuf. `uv sync --extra observability` (ou build Docker avec
# `--build-arg INSTALL_EXTRAS=observability`) pour l'activer.
observability = [
    # >=1.0.0 : réaffirme la contrainte de openinference-instrumentation-anthropic —
    # l'API Messages utilisée dans app/llm/providers/anthropic.py (messages.create,
    # RateLimitError) est inchangée depuis la 0.x, donc combiner cette borne avec la
    # dépendance de base ne casse rien même sans cet extra installé.
    "anthropic>=1.0.0",
    "arize-phoenix-otel>=0.8.0",
    "openinference-instrumentation-anthropic>=0.1.13",
    "openinference-instrumentation-openai>=0.1.19",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-generated revisions (spec 003) are machine-produced and get regenerated on
# every autogenerate run — hand-styling them fights the tool that owns them.
extend-exclude = ["migrations/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "babel>=2.18.0",
]
