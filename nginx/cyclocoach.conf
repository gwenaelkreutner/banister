  GNU nano 7.2                                                         /etc/nginx/sites-enabled/cyclocoach                                                                  
server {
    listen 80;
    server_name srv1287398.hstgr.cloud;

    # ON GARDE ÇA pour les futurs renouvellements (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirection vers HTTPS pour tout le reste
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name srv1287398.hstgr.cloud;

    ssl_certificate /etc/letsencrypt/live/srv1287398.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1287398.hstgr.cloud/privkey.pem;

    # ... reste de la config proxy vers port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}