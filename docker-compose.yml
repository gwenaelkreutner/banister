services:
  db:
    image: postgres:16-alpine
    container_name: banister_db
    restart: always
    environment:
      POSTGRES_DB: banister
      POSTGRES_USER: banister
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banister"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: banister_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
